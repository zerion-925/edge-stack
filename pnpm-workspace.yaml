packages:
  - apps/*
  - packages/*
  - workers/*

allowBuilds:
  esbuild: true
  msw: true
  workerd: true

catalog:
  "@t3-oss/env-core": 0.13.11
  neverthrow: 8.2.0
  typescript: 7.0.2
  vitest: 5.0.5
  wrangler: 4.156.0
  zod: 4.6.7

minimumReleaseAgeExclude:
  - knip@6.44.1
  - lucide-react@1.66.0
  - react-resizable-panels@4.16.0

onlyBuiltDependencies:
  - "@biomejs/biome"
  - esbuild
  - sharp
  - workerd
